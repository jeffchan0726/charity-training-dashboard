<!DOCTYPE html>
<html lang="zh-HK" class="mobile-app">
<!--
Local Development Instructions:
- DO NOT open this file directly with file:// (fetch partials 會失敗).
- Always run a local server, e.g. python -m http.server 8080
- CSS is compiled: tools/tailwindcss.exe -i ./css/input.css -o ./css/tailwind.css --minify
- Google Apps Script backend still required for per-user data.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Jeff Recomp 挑戰</title>
    <link rel="icon" href="images/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#166534">
    <link rel="stylesheet" href="css/tailwind.css?v=2.4.14">
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/app-chrome.css?v=2.4.14">
    <link rel="stylesheet" href="css/mobile-app.css?v=2.4.14">
</head>
<body class="bg-[#1c1917] text-[#e7e5e4]">
    <div id="app-shell">
        <header id="app-chrome">
            <div id="app-header" class="charity-header text-white">
                <div class="app-header-inner px-4">
                    <div class="flex items-center justify-between gap-2 overflow-hidden">
                        <div class="flex items-center gap-2.5 min-w-0 flex-1">
                            <i class="fa-solid fa-heart text-xl shrink-0" aria-hidden="true"></i>
                            <div class="min-w-0">
                                <h1 class="app-title truncate">Jeff Recomp 挑戰</h1>
                                <p class="app-subtitle truncate">慈善賽訓練中心</p>
                            </div>
                        </div>
                        <div class="app-header-actions flex items-center shrink-0 relative">
                            <button type="button" id="loginBtn" onclick="showLoginModal()"
                                class="app-header-btn bg-white text-[#166534] font-semibold">登入</button>
                            <button type="button" id="accountMenuBtn" class="hidden account-chip" aria-haspopup="true" aria-expanded="false" aria-controls="accountMenu" onclick="toggleAccountMenu()">
                                <i class="fa-solid fa-user" aria-hidden="true"></i>
                                <span id="currentUserName" class="truncate max-w-[88px]"></span>
                                <span class="sr-only">帳戶選單</span>
                            </button>
                            <div id="accountMenu" class="account-menu hidden" role="menu" hidden>
                                <button type="button" role="menuitem" id="addUserBtn" onclick="closeAccountMenu(); showAddUserModal()">新增用戶</button>
                                <button type="button" role="menuitem" id="logoutBtn" onclick="closeAccountMenu(); logoutUser()">登出</button>
                            </div>

                            <div id="global-sync-indicator"
                                 class="hidden items-center gap-1.5 px-2 py-1 rounded-2xl text-xs font-medium bg-white/10 text-white/90 border border-white/20 min-w-[20px] min-h-[44px] cursor-default"
                                 title="雲端同步狀態">
                                <i id="sync-icon" class="fa-solid fa-circle text-[9px]" aria-hidden="true"></i>
                                <span id="sync-text" class="hidden text-[9px] leading-none"></span>
                                <span class="sr-only">雲端同步狀態</span>
                            </div>
                            <div id="initial-load-indicator"
                                 class="hidden items-center gap-1.5 px-2 py-1 rounded-2xl text-xs font-medium bg-white/10 text-white/90 border border-white/20 min-w-[22px] min-h-[44px] cursor-default"
                                 title="初始載入狀態">
                                <i id="initial-sync-icon" class="fa-solid fa-cloud-download-alt text-[9px]" aria-hidden="true"></i>
                                <span id="initial-sync-text" class="hidden text-[9px] leading-none"></span>
                                <span class="sr-only">初始載入狀態</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main id="app-main" class="px-4 pt-4 pb-app">
            <p id="app-boot-splash" class="text-sm text-[#a8a29e] py-8 text-center">載入畫面…</p>
            <p id="app-boot-error" class="hidden text-sm text-red-400 py-4 text-center"></p>
            <div id="app-panels"></div>
        </main>

        <nav id="main-bottom-nav" class="app-bottom-nav" role="tablist" aria-label="主選單">
            <button type="button" role="tab" aria-selected="true" aria-controls="content-overview" id="tab-overview" class="nav-tab active" onclick="switchTab('overview')">
                <i class="fa-solid fa-sun" aria-hidden="true"></i><span>今日</span>
            </button>
            <button type="button" role="tab" aria-selected="false" aria-controls="content-log" id="tab-log" class="nav-tab" onclick="switchTab('log')">
                <i class="fa-solid fa-dumbbell" aria-hidden="true"></i><span>訓練</span>
            </button>
            <button type="button" role="tab" aria-selected="false" aria-controls="content-calories" id="tab-calories" class="nav-tab jeff-diet-only" onclick="switchTab('calories')">
                <i class="fa-solid fa-utensils" aria-hidden="true"></i><span>飲食</span>
            </button>
            <button type="button" role="tab" aria-selected="false" aria-controls="content-millennium" id="tab-millennium" class="nav-tab" onclick="switchTab('millennium')">
                <i class="fa-solid fa-mountain" aria-hidden="true"></i><span>任務</span>
            </button>
            <button type="button" role="tab" aria-selected="false" aria-controls="content-me" id="tab-me" class="nav-tab" onclick="switchTab('me')">
                <i class="fa-solid fa-user" aria-hidden="true"></i><span>我</span>
            </button>
        </nav>
        <!-- alias kept so fullscreen.js restore still finds a nav node -->
        <div id="main-top-nav" class="hidden" hidden></div>
    </div>

    <div id="loginModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[140]">
        <div class="bg-[#1c1917] border border-[#44403c] rounded-3xl w-full max-w-md p-5 mx-4">
            <h3 class="font-bold text-xl mb-4">用戶登入</h3>
            <div class="space-y-4">
                <input type="text" id="loginUsername" placeholder="用戶名稱 (只限小寫英文字母 + 數字)"
                    class="w-full bg-[#292524] border border-[#57534e] rounded-2xl px-4 py-2.5"
                    autocomplete="username"
                    oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9]/g, '')">
                <input type="password" id="loginPin" placeholder="PIN 碼 (只限數字)"
                    class="w-full bg-[#292524] border border-[#57534e] rounded-2xl px-4 py-2.5"
                    inputmode="numeric" pattern="[0-9]*" autocomplete="current-password"
                    oninput="this.value = this.value.replace(/\D/g, '')">
            </div>
            <div class="flex gap-x-3 mt-6">
                <button type="button" onclick="hideLoginModal()" class="flex-1 py-2.5 min-h-[44px] rounded-2xl border border-[#57534e]">取消</button>
                <button type="button" id="login-btn" onclick="loginUser()"
                    class="flex-1 py-2.5 min-h-[44px] bg-emerald-600 hover:bg-emerald-700 rounded-2xl font-semibold">登入</button>
            </div>
            <div class="mt-4 text-center text-xs">
                <span class="text-[#a8a29e]">未有帳號？</span>
                <a href="#" onclick="hideLoginModal(); showAddUserModal(); return false;" class="text-emerald-400 hover:underline">建立用戶</a>
            </div>
        </div>
    </div>

    <div id="addUserModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[140]">
        <div class="bg-[#1c1917] border border-[#44403c] rounded-3xl w-full max-w-md p-5 mx-4">
            <h3 class="font-bold text-xl mb-4">新增用戶</h3>
            <div class="bg-yellow-500/10 border border-yellow-500/30 text-yellow-400 text-xs px-3 py-2 rounded-2xl mb-4">
                <i class="fa-solid fa-exclamation-triangle mr-1" aria-hidden="true"></i> 安全提示：請勿使用平時用開嘅密碼作為 PIN
            </div>
            <div class="space-y-4">
                <input type="text" id="newUsername" placeholder="用戶名稱 (只限小寫英文字母 + 數字)"
                    class="w-full bg-[#292524] border border-[#57534e] rounded-2xl px-4 py-2.5"
                    autocomplete="username"
                    oninput="this.value = this.value.toLowerCase().replace(/[^a-z0-9]/g, '')">
                <input type="password" id="newPin" placeholder="設定 PIN 碼 (只限數字)"
                    class="w-full bg-[#292524] border border-[#57534e] rounded-2xl px-4 py-2.5"
                    inputmode="numeric" pattern="[0-9]*" autocomplete="new-password"
                    oninput="this.value = this.value.replace(/\D/g, '')">
            </div>
            <div class="flex gap-x-3 mt-6">
                <button type="button" onclick="hideAddUserModal()"
                    class="flex-1 py-2.5 min-h-[44px] rounded-2xl border border-[#57534e]">取消</button>
                <button type="button" onclick="addNewUser()"
                    class="flex-1 py-2.5 min-h-[44px] bg-emerald-600 hover:bg-emerald-700 rounded-2xl font-semibold">建立用戶</button>
            </div>
            <div class="mt-4 text-center text-xs">
                <span class="text-[#a8a29e]">已有帳號？</span>
                <a href="#" onclick="hideAddUserModal(); showLoginModal(); return false;" class="text-emerald-400 hover:underline">登入</a>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () {});
            });
        }
    </script>
    <script src="js/boot.js?v=2.4.14"></script>
</body>
</html>
